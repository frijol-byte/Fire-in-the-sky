name: assets

on:
  pull_request:
    paths:
      - "tools/blender/**"
      - ".github/workflows/assets.yml"
  push:
    branches: [main]
    paths:
      - "tools/blender/**"
      - ".github/workflows/assets.yml"

jobs:
  blender:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install bpy
        run: |
          python -m venv tools/blender/.venv
          tools/blender/.venv/bin/pip install -q -r tools/blender/requirements.txt
      - name: Pipeline unit tests
        run: tools/blender/.venv/bin/python -m unittest discover -s tools/blender/tests -t tools/blender
      - name: Rebuild every model (fails if any generator errors)
        run: tools/blender/.venv/bin/python tools/blender/build.py --all
      - name: Manifests must match the committed ones
        run: |
          git status --short game/assets/models
          git diff --exit-code -- 'game/assets/models/**/*.manifest.json'
          if git status --porcelain -- 'game/assets/models/**/*.manifest.json' | grep -q '^??'; then
            echo "A recipe has no committed manifest; run build.py --all and commit it."; exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: model-previews
          path: docs/previews/*.png

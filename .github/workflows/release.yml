name: release

on:
  push:
    tags:
      - "v*"
      - "playtest-*"
  # The owner can also publish a release (and its new tag) from GitHub's Releases page; this
  # run then attaches the builds and the notes to that release.
  release:
    types: [published]

# A release made on the website can fire both events; run them one after the other.
concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: write # create the GitHub Release

jobs:
  release:
    if: startsWith(github.ref_name, 'v') || startsWith(github.ref_name, 'playtest-')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-build
      - name: tools/check.sh
        run: bash tools/check.sh
      - name: Write version, export Windows + Linux, boot the Linux build
        run: bash tools/ci/export.sh
      - name: Zip builds and write release notes
        run: |
          mkdir -p dist
          (cd build/export/windows && zip -r "../../../dist/FireInTheSky-windows-${GITHUB_REF_NAME}.zip" .)
          (cd build/export/linux && zip -r "../../../dist/FireInTheSky-linux-${GITHUB_REF_NAME}.zip" .)
          python3 tools/ci/release_notes.py "${GITHUB_REF_NAME}" > dist/RELEASE_NOTES.md
          cat dist/RELEASE_NOTES.md
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          flags=()
          case "${GITHUB_REF_NAME}" in playtest-*) flags+=(--prerelease) ;; esac
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" dist/*.zip --clobber
            gh release edit "${GITHUB_REF_NAME}" --notes-file dist/RELEASE_NOTES.md "${flags[@]}"
          else
            gh release create "${GITHUB_REF_NAME}" dist/*.zip \
              --title "${GITHUB_REF_NAME}" \
              --notes-file dist/RELEASE_NOTES.md \
              "${flags[@]}"
          fi

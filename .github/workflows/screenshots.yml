name: screenshots

on:
  pull_request:
    paths:
      - "game/**"
      - "tools/screenshot.sh"
      - "tools/screenshot/**"
      - "tools/tests/screenshot_test.sh"
      - "tools/cloud/setup.sh"
      - ".godot-version"
      - ".github/workflows/screenshots.yml"
  push:
    branches: [main]
    paths:
      - "game/**"
      - "tools/screenshot.sh"
      - "tools/screenshot/**"
      - ".godot-version"
      - ".github/workflows/screenshots.yml"

jobs:
  screens:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Bootstrap (Godot, Xvfb, Mesa lavapipe)
        run: bash tools/cloud/setup.sh
      - name: Screenshot harness self-test
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          bash tools/tests/screenshot_test.sh
      - name: Render every shot scene
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          bash tools/screenshot.sh --all
      - uses: actions/upload-artifact@v4
        with:
          name: screens
          path: build/screens/*.png
          if-no-files-found: error
